name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build
        shell: bash
        run: |
          scripts/build-linux-host.bash
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          name: local_file_server_gnulinux_amd64
          path: target/x86_64-unknown-linux-gnu/release/local_file_server
      - uses: actions/upload-artifact@v7
        with:
          archive: false
          name: local_file_server_windows_amd64.exe
          path: target/x86_64-pc-windows-gnu/release/local_file_server.exe

  check:
    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check
        shell: bash
        run: |
          set -euo pipefail
          shellcheck scripts/*
          cargo fmt --check
          cargo clippy -- -D warnings
          cargo test

