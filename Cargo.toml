[package]
name = "local_file_server"
edition = "2024"
license-file = "LICENSE.md"
version = "0.1.0"

[dependencies]
axum = { version = "0.8.9", features = ["http1", "tokio"], default-features = false }
tokio = { version = "1.54.1", features = ["macros", "rt"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["fs"] }
webbrowser = { version = "1.2.6", features = ["disable-wsl"] }

[profile.release]
panic = "abort"
opt-level = "z"
codegen-units = 1
lto = true
debug = "none"
strip = true

[workspace.metadata.cross.target.x86_64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/x86_64-unknown-linux-gnu@sha256:8859395961030cc16506872272a547dce07126daf69007d492cb28217d37cd28"

[workspace.metadata.cross.target.x86_64-pc-windows-gnu]
image = "ghcr.io/cross-rs/x86_64-pc-windows-gnu@sha256:faf3c23e786ee681c32737331d76ef1a29d4c1d26f5c219ebd335a3f60d22629"
